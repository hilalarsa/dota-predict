<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TI 2026 Predictor</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --plane: #f9f9f7;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --blue: #2a78d6;
  --blue-100: #cde2fb;
  --blue-250: #86b6ef;
  --red: #e34948;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d; --ink-1: #fff; --ink-2: #c3c2b7;
    --ink-muted: #898781; --grid: #2c2c2a; --baseline: #383835;
    --ring: rgba(255,255,255,0.10);
    --blue: #3987e5; --blue-100: #184f95; --blue-250: #1c5cab; --red: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --plane: #0d0d0d; --ink-1: #fff; --ink-2: #c3c2b7;
  --ink-muted: #898781; --grid: #2c2c2a; --baseline: #383835;
  --ring: rgba(255,255,255,0.10);
  --blue: #3987e5; --blue-100: #184f95; --blue-250: #1c5cab; --red: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--ink-1);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 96px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -0.01em; }
p.sub { color: var(--ink-2); margin: 0 0 20px; font-size: 13.5px; }
section { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 10px; padding: 20px; margin: 18px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--ink-muted); font-size: 11.5px;
     text-transform: uppercase; letter-spacing: .05em; padding: 0 8px 7px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.bar { height: 8px; border-radius: 4px; background: var(--blue); min-width: 2px; }
.track { background: var(--grid); height: 8px; border-radius: 4px; width: 100%; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
         padding: 1px 7px; border-radius: 999px; border: 1px solid var(--ring); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
select, input, button { font: inherit; font-size: 13.5px; padding: 6px 9px; border-radius: 7px;
  border: 1px solid var(--baseline); background: var(--surface-1); color: var(--ink-1); }
button { cursor: pointer; font-weight: 600; }
button:hover { background: var(--grid); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
.hero-in { width: 100%; margin-bottom: 5px; }
.big { font-size: 40px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; }
.mut { color: var(--ink-2); font-size: 12.5px; }
.mutt { color: var(--ink-muted); font-size: 12px; }
.split { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface-1); }
.split > div { display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 650; color: #fff; }
details { border-top: 1px solid var(--grid); padding-top: 10px; margin-top: 10px; }
summary { cursor: pointer; font-size: 13px; color: var(--ink-2); font-weight: 600; }
code { background: var(--grid); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.note { color: var(--ink-muted); font-size: 12px; font-style: italic; }
.tt { position: fixed; pointer-events: none; z-index: 9; background: var(--surface-1); color: var(--ink-1);
  border: 1px solid var(--ring); border-radius: 7px; padding: 7px 10px; font-size: 12.5px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16); display: none; max-width: 260px; }
tbody tr.hoverable:hover { background: color-mix(in srgb, var(--grid) 45%, transparent); }
ul.tight { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
ul.tight li { margin-bottom: 4px; }

/* --- bracket --- */
.br { display: grid; gap: 14px 26px; align-items: center; min-width: max-content; padding: 4px 0; }
.br-ub { grid-template-columns: repeat(2, 216px); }
.br-lb { grid-template-columns: repeat(4, 216px); }
.stage { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600;
  color: var(--ink-muted); margin: 18px 0 8px; }
.mbox { position: relative; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface-1); }
.mbox.win { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
.mbox[data-conn]::before { content: ''; position: absolute; left: -26px; top: 50%;
  width: 26px; height: 1px; background: var(--baseline); }
.mtitle { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-muted); padding: 7px 10px 5px; border-bottom: 1px solid var(--grid); }
.mside { padding: 6px 10px; }
.mrow { display: flex; align-items: center; gap: 6px; font-size: 12.5px; line-height: 1.7; }
.mrow .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow:first-child .nm { font-weight: 650; }
.mrow .bg { width: 34px; height: 5px; border-radius: 3px; background: var(--grid); flex: none; }
.mrow .bg i { display: block; height: 100%; border-radius: 3px; background: var(--blue); }
.mrow .pc { width: 34px; text-align: right; font-variant-numeric: tabular-nums;
  color: var(--ink-2); font-size: 11.5px; flex: none; }
.mvs { border-top: 1px dashed var(--grid); margin: 0 10px; }
.hm { border-collapse: separate; border-spacing: 2px; }
.hm td.c { width: 52px; text-align: center; font-size: 11.5px; font-variant-numeric: tabular-nums;
  border-radius: 4px; padding: 5px 0; }
/* --- interactive bracket builder --- */
.bbox { position: relative; border: 1px solid var(--ring); border-radius: 8px;
  background: var(--surface-1); overflow: hidden; }
.bbox[data-conn]::before { content: ''; position: absolute; left: -26px; top: 50%;
  width: 26px; height: 1px; background: var(--baseline); }
.bteam { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer;
  border: none; background: none; width: 100%; text-align: left; font: inherit; font-size: 13px;
  color: var(--ink-1); border-radius: 0; }
.bteam:hover:not(:disabled) { background: color-mix(in srgb, var(--blue) 12%, transparent); }
.bteam:disabled { cursor: default; color: var(--ink-muted); }
.bteam .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bteam .wp { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12px; }
.bteam.picked { background: color-mix(in srgb, var(--blue) 18%, transparent); font-weight: 700; }
.bteam.picked .nm::before { content: '✓ '; color: var(--blue); font-weight: 700; }
.bteam.beaten { opacity: .45; text-decoration: line-through; }
.sc { display: flex; height: 20px; gap: 2px; padding: 0 10px 9px; background: var(--surface-1); }
.sc > span { display: flex; align-items: center; justify-content: center; font-size: 10px;
  font-weight: 700; border-radius: 3px; overflow: hidden; white-space: nowrap; min-width: 2px; }
/* Ordered within each side: decisive at the outside, deciding-game in the middle.
   Two one-hue ramps meeting at the centre = a diverging scale over margin. */
/* Label ink is picked per step for >=4.5:1 ON that step, not by side --
   white on the mid blue measures 4.42 and fails. */
.a0 { background: light-dark(#184f95, #9ec5f4); color: light-dark(#ffffff, #0b0b0b); }
.a1 { background: light-dark(#256abf, #3987e5); color: light-dark(#ffffff, #0b0b0b); }
.a2 { background: light-dark(#86b6ef, #1c5cab); color: light-dark(#0b0b0b, #ffffff); }
.b2 { background: light-dark(#f0908f, #8c2523); color: light-dark(#0b0b0b, #ffffff); }
.b1 { background: light-dark(#e34948, #c23a39); color: light-dark(#0b0b0b, #ffffff); }
.b0 { background: light-dark(#b32e2d, #f0908f); color: light-dark(#ffffff, #0b0b0b); }
.seedgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
@media (max-width: 760px) { .seedgrid { grid-template-columns: repeat(2, 1fr); } }
.seedgrid label { font-size: 11px; color: var(--ink-muted); font-weight: 600; display: block; }
.seedgrid select { width: 100%; margin-top: 2px; }
.champbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 8px;
  border: 1px solid var(--blue); background: color-mix(in srgb, var(--blue) 12%, transparent); }
.cutrow { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 5px 8px !important; color: var(--ink-2); border-top: 2px solid var(--warning);
  background: color-mix(in srgb, var(--warning) 9%, transparent); }
.cutrow.out { border-top-color: var(--critical);
  background: color-mix(in srgb, var(--critical) 9%, transparent); }
/* Sequential ramp: one blue hue, light->dark on the light surface and
   dark->light on the dark one. light-dark() reads the color-scheme that both
   the media query and the [data-theme] toggle above already set. */
.ramp0 { background: light-dark(#eef4fd, #201f1e); color: light-dark(#52514e, #898781); }
.ramp1 { background: light-dark(#cde2fb, #0d366b); color: light-dark(#0b0b0b, #ffffff); }
.ramp2 { background: light-dark(#9ec5f4, #184f95); color: light-dark(#0b0b0b, #ffffff); }
.ramp3 { background: light-dark(#5598e7, #256abf); color: light-dark(#0b0b0b, #ffffff); }
.ramp4 { background: light-dark(#256abf, #3987e5); color: #ffffff; }
.ramp5 { background: light-dark(#104281, #86b6ef); color: light-dark(#ffffff, #0b0b0b); }
</style>
</head>
<body>
<div class="wrap">
  <h1>The International 2026 — Predictor</h1>
  <p class="sub" id="meta">loading…</p>
  <div id="app"></div>
</div>
<div class="tt" id="tt"></div>

<script>
// ---------------------------------------------------------------------------
// model constants -- every knob that matters, in one place
// ---------------------------------------------------------------------------
const CFG = {
  formHalfLifeDays: 240,   // Elo K halves every N days of match age
  formK: 22,               // base K for the form pass
  sigmaBase: 55,           // rating uncertainty floor (Elo points)
  sigmaThinRecent: 70,     // extra uncertainty when the last 90d is thin
  sigmaThinTotal: 60,      // extra uncertainty when the whole history is thin
  sigmaRosterBreak: 70,    // extra uncertainty when these are different players
  h2hHalfLifeDays: 300,
  h2hPrior: 5,             // pseudo-matches pulling H2H toward the Elo baseline
  h2hMaxSwing: 0.07,       // H2H can move win prob by at most +/- 7pt
  heroPatchWeights: [1, 2, 3],  // oldest -> newest of the last 3 patches
  heroShrink: 8,           // pseudo-games pulling a team's hero WR to its baseline
  metaShrink: 40,          // pseudo-games pulling meta hero WR to 50%
  draftScale: 500,         // draft edge (win-prob units) -> Elo points
  draftMaxElo: 150,        // hard cap so a draft never outweighs the teams
  sims: 20000,
  swissRounds: 5,
};
const q = Math.LN10 / 400;
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) n.append(k?.nodeType ? k : document.createTextNode(k ?? ''));
  return n;
};
const pct = x => (100 * x).toFixed(1) + '%';
const pct0 = x => Math.round(100 * x) + '%';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

// ---------------------------------------------------------------------------
let D, T, POOL, HEROES, HERO_BY_NAME, PATCHES, sim = null;

fetch('data.json').then(r => {
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).then(d => { D = d; build(); render(); }).catch(e => {
  $('#meta').textContent = '';
  $('#app').append(el('section', {}, el('h2', {}, 'Could not load data.json'),
    el('p', { class: 'sub' }, String(e)),
    el('p', { class: 'sub', html: 'Run <code>python3 fetch.py</code> to generate it, then serve this folder — <code>file://</code> blocks fetch. <code>python3 -m http.server 8000</code> then open <code>http://localhost:8000</code>.' })));
});

// ---------------------------------------------------------------------------
// build(): ratings, form, hero tables -- all derived once from data.json
// ---------------------------------------------------------------------------
function build() {
  const now = D.generated;
  HEROES = D.heroes;
  HERO_BY_NAME = Object.fromEntries(Object.entries(HEROES).map(([id, n]) => [n.toLowerCase(), +id]));
  PATCHES = D.patches;                       // oldest -> newest

  // -- rating: seed from OpenDota's maintained pro Elo, then a time-decayed
  //    form pass over the last ~18 months. Recent results move a team most.
  const R = {};
  for (const [id, r] of Object.entries(D.opponent_ratings)) R[id] = r ?? 1200;
  for (const m of D.match_pool) {
    const a = String(m.a), b = String(m.b);
    if (R[a] == null) R[a] = 1200;
    if (R[b] == null) R[b] = 1200;
    const K = CFG.formK * Math.pow(0.5, ((now - m.t) / 86400) / CFG.formHalfLifeDays);
    const ea = 1 / (1 + Math.pow(10, (R[b] - R[a]) / 400));
    const d = K * ((m.a_win ? 1 : 0) - ea);
    R[a] += d; R[b] -= d;
  }

  // -- hero tables, keyed by team id then patch name
  const th = {};
  for (const r of D.team_heroes) (th[r.team_id] ??= {})[r.patch + '|' + r.hero_id] = { g: +r.games, w: +r.wins };
  const meta = {};
  for (const r of D.meta_heroes) meta[r.patch + '|' + r.hero_id] = { g: +r.games, w: +r.wins };
  D.metaIdx = meta;

  const day = 86400;
  T = D.teams.map((t, i) => {
    const ms = t.matches;
    const since = n => ms.filter(m => m.t > now - n * day);
    const r90 = since(90), r180 = since(180);
    const wins = ms.filter(m => m.win).length;
    const last = ms.length ? ms[ms.length - 1].t : 0;
    // An org rename is not a roster break -- only a player change is, and that
    // is declared in teams.py rather than guessed from the note text.
    const rosterBreak = !!t.roster_break;
    const sigma = CFG.sigmaBase
      + CFG.sigmaThinRecent * Math.exp(-r90.length / 12)
      + CFG.sigmaThinTotal * Math.exp(-ms.length / 40)
      + (rosterBreak ? CFG.sigmaRosterBreak : 0);
    // merge hero rows across all of the org's team ids
    const heroes = {};
    for (const id of t.ids) for (const [k, v] of Object.entries(th[id] || {})) {
      const cur = heroes[k] ??= { g: 0, w: 0 };
      cur.g += v.g; cur.w += v.w;
    }
    return {
      i, name: t.name, qual: t.qual, note: t.note, ids: t.ids, idSet: new Set(t.ids),
      logo: t.od.logo_url, rating: R[String(t.ids[0])] ?? 1200, sigma, rosterBreak,
      matches: ms, n: ms.length, wr: ms.length ? wins / ms.length : 0.5,
      w90: r90.filter(m => m.win).length, n90: r90.length,
      n180: r180.length, lastMatch: last, daysIdle: (now - last) / day,
      form: ms.slice(-20).map(m => m.win),
      heroes,
    };
  });
  // team baseline WR used as the shrinkage prior for its hero winrates
  for (const t of T) t.base = t.n90 >= 10 ? t.w90 / t.n90 : t.wr;
  T.sort((a, b) => b.rating - a.rating);
  T.forEach((t, k) => t.rank = k + 1);

  POOL = D.match_pool;
}

// --- core probability ------------------------------------------------------
// Glicko-style: wide rating uncertainty pulls the prediction toward 50/50,
// which is exactly what a 15-game roster deserves.
function pGame(ra, rb, sa = 0, sb = 0, eloAdj = 0) {
  const g = 1 / Math.sqrt(1 + 3 * q * q * (sa * sa + sb * sb) / (Math.PI ** 2));
  return 1 / (1 + Math.pow(10, -g * (ra - rb + eloAdj) / 400));
}
const bo3 = p => p * p * (3 - 2 * p);
const bo5 = p => p * p * p * (6 * p * p - 15 * p + 10);

function h2h(a, b) {
  let w = 0, n = 0, raw = 0, rawN = 0;
  for (const m of POOL) {
    const aIsA = a.idSet.has(m.a) && b.idSet.has(m.b);
    const aIsB = a.idSet.has(m.b) && b.idSet.has(m.a);
    if (!aIsA && !aIsB) continue;
    const aWon = aIsA ? m.a_win : !m.a_win;
    const d = Math.pow(0.5, ((D.generated - m.t) / 86400) / CFG.h2hHalfLifeDays);
    n += d; if (aWon) w += d;
    rawN++; if (aWon) raw++;
  }
  return { n, w, raw, rawN };
}

// Residual on top of Elo: does A beat B more than their ratings imply?
function h2hAdj(a, b, pBase) {
  const { n, w } = h2h(a, b);
  if (n < 1) return 0;
  const obs = w / n;
  return clamp(0.35 * (n / (n + CFG.h2hPrior)) * (obs - pBase), -CFG.h2hMaxSwing, CFG.h2hMaxSwing);
}

// --- draft ----------------------------------------------------------------
// Per hero: how much better is this team than its own baseline on it, and how
// good is the hero in the current pro meta. Both shrunk by sample size.
function heroEdge(team, heroId) {
  let g = 0, w = 0, raw = 0;
  PATCHES.forEach((p, k) => {
    const cell = team.heroes[p.name + '|' + heroId];
    if (!cell) return;
    const wt = CFG.heroPatchWeights[k] ?? 1;
    g += wt * cell.g; w += wt * cell.w; raw += cell.g;
  });
  const teamWr = (w + CFG.heroShrink * team.base) / (g + CFG.heroShrink);
  const latest = PATCHES[PATCHES.length - 1].name;
  const mc = D.metaIdx[latest + '|' + heroId] || { g: 0, w: 0 };
  const metaWr = (mc.w + CFG.metaShrink * 0.5) / (mc.g + CFG.metaShrink);
  return {
    heroId, games: g, raw, teamWr, metaWr, metaGames: mc.g,
    edge: 0.55 * (teamWr - team.base) + 0.45 * (metaWr - 0.5),
  };
}
function draftDelta(team, heroIds) {
  const parts = heroIds.filter(Boolean).map(h => heroEdge(team, h));
  return { parts, sum: parts.reduce((s, p) => s + p.edge, 0) };
}

// --- confidence -----------------------------------------------------------
// Deliberately measures DATA QUALITY, not how lopsided the call is. A 50/50
// between two well-documented teams is a high-confidence 50/50.
function confidence(...teams) {
  let s = 1;
  for (const t of teams) {
    const sample = Math.min(1, t.n180 / 40) * Math.min(1, t.n / 120);
    const fresh = Math.min(1, 1 / (1 + t.daysIdle / 45));
    s *= Math.sqrt(sample) * (0.55 + 0.45 * fresh) * (t.rosterBreak ? 0.72 : 1);
  }
  // ceiling at 95: esports data is never a perfect description of a team
  return Math.min(95, 100 * Math.pow(s, 1 / teams.length));
}
const GRADE = c => c >= 78 ? ['A', 'var(--good)', 'High'] : c >= 62 ? ['B', 'var(--warning)', 'Moderate']
  : c >= 44 ? ['C', 'var(--serious)', 'Low'] : ['D', 'var(--critical)', 'Very low'];
function confBadge(c) {
  const [g, col, label] = GRADE(c);
  return el('span', { class: 'badge', title: `Data-quality confidence ${c.toFixed(0)}/100 — ${label}` },
    el('span', { class: 'dot', style: `background:${col}` }), `${g} · ${c.toFixed(0)}`);
}

// --- matchup --------------------------------------------------------------
function predict(a, b, draftA = [], draftB = []) {
  const dA = draftDelta(a, draftA), dB = draftDelta(b, draftB);
  const eloAdj = clamp(CFG.draftScale * (dA.sum - dB.sum), -CFG.draftMaxElo, CFG.draftMaxElo);
  const base = pGame(a.rating, b.rating, a.sigma, b.sigma, eloAdj);
  const adj = h2hAdj(a, b, pGame(a.rating, b.rating, a.sigma, b.sigma));
  const p = clamp(base + adj, 0.02, 0.98);
  const nHero = [...dA.parts, ...dB.parts].reduce((s, x) => s + x.games, 0);
  const draftConf = draftA.filter(Boolean).length + draftB.filter(Boolean).length
    ? Math.min(1, nHero / 120) : 1;
  return { p, base, h2hAdj: adj, eloAdj, dA, dB, h2h: h2h(a, b),
    conf: confidence(a, b) * (0.7 + 0.3 * draftConf) };
}

// ---------------------------------------------------------------------------
// bracket Monte Carlo
// Format (Liquipedia, TI 2026): Swiss-16 all Bo3 -> top 3 straight to the Main
// Event, 4th-13th into an elimination round where 5 advance, rest out. Main
// Event is an 8-team double elimination, Bo3, Bo5 grand final.
// ---------------------------------------------------------------------------
// mulberry32 — seeded so a re-run reproduces. A plain LCG is wrong here: the
// multiply overflows JS's 53-bit floats and the stream degenerates.
let seed = 12345;
function rnd() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gauss() { // Box-Muller
  let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function runSims(n = CFG.sims) {
  const N = T.length;
  const tally = T.map(() => ({ champ: 0, final: 0, top4: 0, main: 0, swiss3: 0, out: 0, swissWins: 0 }));
  const h2hCache = T.map((a) => T.map((b) => a === b ? 0 : h2hAdj(a, b, pGame(a.rating, b.rating, a.sigma, b.sigma))));
  const batches = [], BATCH = Math.floor(n / 10);
  let batchChamp = T.map(() => 0);
  // who ends up standing in each bracket position -- the sim already walks
  // every one of these, it just used to throw them away
  const slots = {};
  const put = (name, i) => ((slots[name] ??= new Array(N).fill(0))[i]++);
  const swissRec = T.map(() => new Array(CFG.swissRounds + 1).fill(0));
  const swissSeed = T.map(() => new Array(N).fill(0));

  for (let s = 0; s < n; s++) {
    // draw a rating for each team from its own uncertainty -- this is how the
    // "we barely have data on HULIGANI" caveat reaches the final numbers
    const R = T.map(t => t.rating + t.sigma * gauss());
    const win = (i, j, bo) => {           // P(i beats j) this sim, then flip a coin
      const p = clamp(pGame(R[i], R[j]) + h2hCache[i][j], 0.02, 0.98);
      return rnd() < (bo === 5 ? bo5(p) : bo3(p));
    };

    // ---- Swiss
    const rec = T.map((_, i) => ({ i, w: 0, l: 0, opp: [] }));
    for (let r = 0; r < CFG.swissRounds; r++) {
      // random key assigned once — a rnd() comparator is not a uniform shuffle
      rec.forEach(r => r.k = rnd());
      const pool = rec.slice().sort((a, b) => (b.w - a.w) || (a.k - b.k));
      const used = new Set();
      for (let x = 0; x < pool.length; x++) {
        const A = pool[x];
        if (used.has(A.i)) continue;
        let B = null, fallback = null;
        for (let y = x + 1; y < pool.length; y++) {
          const C = pool[y];
          if (used.has(C.i)) continue;
          fallback ??= C;
          if (!A.opp.includes(C.i)) { B = C; break; }
        }
        B ??= fallback;
        if (!B) continue;
        used.add(A.i); used.add(B.i); A.opp.push(B.i); B.opp.push(A.i);
        if (win(A.i, B.i, 3)) { A.w++; B.l++; } else { B.w++; A.l++; }
      }
    }
    const buch = a => a.opp.reduce((s, o) => s + rec[o].w, 0);
    const std = rec.slice().sort((a, b) => (b.w - a.w) || (buch(b) - buch(a)) || (R[b.i] - R[a.i]));
    std.forEach((r, k) => {
      tally[r.i].swissWins += r.w;
      swissSeed[r.i][k]++; swissRec[r.i][r.w]++;
    });
    const top3 = std.slice(0, 3).map(r => r.i);
    top3.forEach(i => tally[i].swiss3++);
    const mid = std.slice(3, 13).map(r => r.i);           // seeds 4..13
    std.slice(13).forEach(r => tally[r.i].out++);

    // ---- elimination round: 4v13, 5v12, 6v11, 7v10, 8v9 -> 5 advance
    const advanced = [];
    for (let k = 0; k < 5; k++) {
      const A = mid[k], B = mid[9 - k];
      advanced.push(win(A, B, 3) ? A : B);
    }

    // ---- main event: 8-team double elimination
    const seeds = [...top3, ...advanced];                 // already in seed order
    seeds.forEach((i, k) => { tally[i].main++; put('S' + (k + 1), i); });
    const [s1, s2, s3, s4, s5, s6, s7, s8] = seeds;
    const ubA = win(s1, s4, 3) ? [s1, s4] : [s4, s1];     // [winner, loser]
    const ubB = win(s2, s3, 3) ? [s2, s3] : [s3, s2];
    const ubF = win(ubA[0], ubB[0], 3) ? [ubA[0], ubB[0]] : [ubB[0], ubA[0]];
    const l1 = win(s5, s8, 3) ? s5 : s8;
    const l2 = win(s6, s7, 3) ? s6 : s7;
    const l3 = win(l1, ubB[1], 3) ? l1 : ubB[1];
    const l4 = win(l2, ubA[1], 3) ? l2 : ubA[1];
    const lbSemiW = win(l3, l4, 3) ? l3 : l4;
    const lbSemiL = lbSemiW === l3 ? l4 : l3;             // 4th place
    const lbF = win(lbSemiW, ubF[1], 3) ? lbSemiW : ubF[1];
    [ubF[0], ubF[1], lbSemiW, lbSemiL].forEach(i => tally[i].top4++);
    put('ubfA', ubA[0]); put('ubfB', ubB[0]);
    put('lbr2A1', l1); put('lbr2A2', ubB[1]);
    put('lbr2B1', l2); put('lbr2B2', ubA[1]);
    put('lbsfA', l3); put('lbsfB', l4);
    put('lbfA', lbSemiW); put('lbfB', ubF[1]);
    put('gfA', ubF[0]); put('gfB', lbF);
    const champ = win(ubF[0], lbF, 5) ? ubF[0] : lbF;
    const runner = champ === ubF[0] ? lbF : ubF[0];
    tally[champ].champ++; tally[runner].final++;
    batchChamp[champ]++;
    if ((s + 1) % BATCH === 0) { batches.push(batchChamp); batchChamp = T.map(() => 0); }
  }

  // MC noise: spread of the champion rate across 10 independent batches
  const mcErr = T.map((_, i) => {
    const xs = batches.map(b => b[i] / BATCH);
    const m = xs.reduce((a, c) => a + c, 0) / xs.length;
    return Math.sqrt(xs.reduce((a, c) => a + (c - m) ** 2, 0) / Math.max(1, xs.length - 1)) / Math.sqrt(xs.length);
  });
  return {
    n, slots,
    swissRec: swissRec.map(r => r.map(v => v / n)),
    swissSeed: swissSeed.map(r => r.map(v => v / n)),
    teams: T.map((t, i) => ({
      t, ...Object.fromEntries(Object.entries(tally[i]).map(([k, v]) => [k, v / n])),
      swissWins: tally[i].swissWins / n, mcErr: mcErr[i],
    })),
  };
}

// ---------------------------------------------------------------------------
// main event topology, exactly as the Monte Carlo above walks it. The `lose`
// refs are what make it a double elimination: UB losers drop into LB round 2.
// ---------------------------------------------------------------------------
const BRACKET = [
  { id: 'ubsf1', label: 'UB Semifinal', sub: 'Seed 1 v Seed 4', bo: 3, a: { seed: 0 }, b: { seed: 3 } },
  { id: 'ubsf2', label: 'UB Semifinal', sub: 'Seed 2 v Seed 3', bo: 3, a: { seed: 1 }, b: { seed: 2 } },
  { id: 'ubf', label: 'Upper bracket final', sub: 'winner → grand final', bo: 3, a: { win: 'ubsf1' }, b: { win: 'ubsf2' } },
  { id: 'lbr1a', label: 'LB Round 1', sub: 'Seed 5 v Seed 8', bo: 3, a: { seed: 4 }, b: { seed: 7 } },
  { id: 'lbr1b', label: 'LB Round 1', sub: 'Seed 6 v Seed 7', bo: 3, a: { seed: 5 }, b: { seed: 6 } },
  { id: 'lbr2a', label: 'LB Round 2', sub: 'v UB Semifinal 2 loser', bo: 3, a: { win: 'lbr1a' }, b: { lose: 'ubsf2' } },
  { id: 'lbr2b', label: 'LB Round 2', sub: 'v UB Semifinal 1 loser', bo: 3, a: { win: 'lbr1b' }, b: { lose: 'ubsf1' } },
  { id: 'lbsf', label: 'LB Semifinal', sub: 'loser finishes 4th', bo: 3, a: { win: 'lbr2a' }, b: { win: 'lbr2b' } },
  { id: 'lbf', label: 'LB Final', sub: 'v upper bracket final loser', bo: 3, a: { win: 'lbsf' }, b: { lose: 'ubf' } },
  { id: 'gf', label: 'Grand final', sub: 'Bo5', bo: 5, a: { win: 'ubf' }, b: { win: 'lbf' } },
];
const BY_ID = Object.fromEntries(BRACKET.map(m => [m.id, m]));
const boWin = (p, n) => n === 5 ? bo5(p) : bo3(p);

// Scoreline probabilities, assuming maps are independent at a constant p.
// Ordered decisive-A -> close-A -> close-B -> decisive-B, so the bar diverges
// around the deciding game.
function seriesDist(p, bo) {
  const q = 1 - p;
  return bo === 5 ? [
    { l: '3–0', c: 'a0', p: p ** 3 }, { l: '3–1', c: 'a1', p: 3 * p ** 3 * q },
    { l: '3–2', c: 'a2', p: 6 * p ** 3 * q * q }, { l: '2–3', c: 'b2', p: 6 * p * p * q ** 3 },
    { l: '1–3', c: 'b1', p: 3 * p * q ** 3 }, { l: '0–3', c: 'b0', p: q ** 3 },
  ] : [
    { l: '2–0', c: 'a0', p: p * p }, { l: '2–1', c: 'a1', p: 2 * p * p * q },
    { l: '1–2', c: 'b1', p: 2 * p * q * q }, { l: '0–2', c: 'b0', p: q * q },
  ];
}

  const RAMP = ['ramp0', 'ramp1', 'ramp2', 'ramp3', 'ramp4', 'ramp5'];
  const step = p => Math.min(5, Math.floor(Math.pow(clamp(p / 0.45, 0, 1), 0.6) * 5.999));
  const bySeed = T.map((t, i) => ({ t, i, mean: sim.swissSeed[i].reduce((a, c, k) => a + c * k, 0) }))
    .sort((a, b) => a.mean - b.mean);
  const NCOL = CFG.swissRounds + 5;
  const cutRow = (cls, label) => el('tr', {}, el('td', { class: 'cutrow ' + cls, colspan: String(NCOL) }, label));
  const tb = el('tbody');
  bySeed.forEach(({ t, i, mean }, pos) => {
    // The cut is a line between positions, not a property of a team: the top
    // seed still only averages 4th, so colouring rows by band would overclaim.
    if (pos === 3) tb.append(cutRow('mid', 'Main Event cut — top 3 advance directly'));
    if (pos === 13) tb.append(cutRow('out', 'Elimination cut — seeds 14–16 go home'));
    const r = sim.teams[i];
    tb.append(el('tr', {},
      el('td', {}, el('strong', {}, t.name)),
      el('td', { class: 'num mut' }, (mean + 1).toFixed(1)),
      el('td', { class: 'num' }, pct0(r.swiss3)),
      el('td', { class: 'num mut' }, pct0(r.out)),
      ...sim.swissRec[i].slice().reverse().map((p, k) => {
        const w = CFG.swissRounds - k;
        const c = el('td', { class: 'c ' + RAMP[step(p)] }, p >= 0.005 ? pct0(p) : '·');
        return hoverable(c, `<strong>${t.name}</strong> finishes ${w}–${CFG.swissRounds - w}<br>${pct(p)} of runs`);
      })));
  });
  s.append(el('div', { class: 'scroll' }, el('table', { class: 'hm' },
    el('thead', {}, el('tr', {}, el('th', {}, 'Team'), el('th', { class: 'num' }, 'Avg seed'),
      el('th', { class: 'num' }, 'Top 3'), el('th', { class: 'num' }, 'Out'),
      ...Array.from({ length: CFG.swissRounds + 1 }, (_, k) =>
        el('th', { class: 'num' }, `${CFG.swissRounds - k}–${k}`)))), tb)),
    el('div', { class: 'row', style: 'margin:10px 0 0;gap:6px;font-size:11.5px' },
      el('span', { class: 'mutt' }, 'less likely'),
      ...RAMP.map(r => el('span', { class: r, style: 'width:24px;height:10px;border-radius:3px;display:inline-block' })),
      el('span', { class: 'mutt' }, 'more likely')));

  // elimination round -- fixed pairings off the Swiss seeding
  s.append(el('div', { class: 'stage' }, 'Elimination round · seeds 4–13 · 5 advance · Bo3'));
  // five independent Bo3s, so this row wraps rather than scrolls
  const grid = el('div', { style: 'display:flex;flex-wrap:wrap;gap:14px' });
  for (let k = 0; k < 5; k++) {
    grid.append(matchBox(`Seed ${4 + k} vs seed ${13 - k}`, seedCands(sim, 3 + k), seedCands(sim, 12 - k),
      { grid: 'width:216px' }));
  }
  s.append(grid);
  return s;
}

// ---- 4c. main event
function mainBracket(sim) {
  const s = el('div', {},
    el('div', { class: 'stage' }, 'Main event · 8-team double elimination · Aug 20–23'),
    el('p', { class: 'sub' }, 'Seeds 1–3 come straight from the Swiss, 4–8 from the elimination round. Each box lists the most likely occupants of that slot across all runs.'));

  const ub = el('div', { class: 'br br-ub' });
  ub.append(
    matchBox('UB Semifinal · S1 v S4', cands(sim, 'S1'), cands(sim, 'S4'), { grid: 'grid-area:1/1' }),
    matchBox('UB Semifinal · S2 v S3', cands(sim, 'S2'), cands(sim, 'S3'), { grid: 'grid-area:2/1' }),
    matchBox('Upper bracket final', cands(sim, 'ubfA'), cands(sim, 'ubfB'),
      { conn: 1, grid: 'grid-area:1/2/3/3' }));

  const lb = el('div', { class: 'br br-lb' });
  lb.append(
    matchBox('LB Round 1 · S5 v S8', cands(sim, 'S5'), cands(sim, 'S8'), { grid: 'grid-area:1/1' }),
    matchBox('LB Round 1 · S6 v S7', cands(sim, 'S6'), cands(sim, 'S7'), { grid: 'grid-area:2/1' }),
    matchBox('LB Round 2', cands(sim, 'lbr2A1'), cands(sim, 'lbr2A2'), { conn: 1, grid: 'grid-area:1/2' }),
    matchBox('LB Round 2', cands(sim, 'lbr2B1'), cands(sim, 'lbr2B2'), { conn: 1, grid: 'grid-area:2/2' }),
    matchBox('LB Semifinal', cands(sim, 'lbsfA'), cands(sim, 'lbsfB'), { conn: 1, grid: 'grid-area:1/3/3/4' }),
    matchBox('LB Final · v UB loser', cands(sim, 'lbfA'), cands(sim, 'lbfB'), { conn: 1, grid: 'grid-area:1/4/3/5' }));

  const gf = el('div', { class: 'br', style: 'grid-template-columns:216px 216px' });
  const winner = sim.teams.map(r => ({ t: r.t, p: r.champ })).filter(x => x.p > 0)
    .sort((a, b) => b.p - a.p);
  gf.append(
    matchBox('Grand final · Bo5', cands(sim, 'gfA'), cands(sim, 'gfB'), { win: 1 }),
    matchBox('🏆 Champion', winner, null, { conn: 1, win: 1 }));

  s.append(el('div', { class: 'scroll' }, el('div', { class: 'stage' }, 'Upper bracket'), ub,
    el('div', { class: 'stage' }, 'Lower bracket'), lb,
    el('div', { class: 'stage' }, 'Grand final'), gf));
  return s;
}

// ---- 4d. bracket forecast
function bracketSection() {
  const s = el('section', {}, el('h2', {}, 'TI 2026 bracket forecast'),
    el('p', { class: 'sub' }, `${CFG.sims.toLocaleString()} Monte Carlo runs of the full event: Swiss-16 (Bo3, ${CFG.swissRounds} rounds) → top 3 direct to the Main Event, seeds 4–13 through an elimination round where 5 advance → 8-team double elimination, Bo5 grand final. Each run redraws every team's rating from its own uncertainty band.`));
  const out = el('div');
  const run = () => {
    out.replaceChildren(el('p', { class: 'sub' }, 'simulating…'));
    setTimeout(() => {
      seed = 12345; sim = runSims();
      out.replaceChildren(simTable(sim.teams), swissView(sim), mainBracket(sim));
    }, 20);
  };
  s.append(el('div', { class: 'row' }, el('button', { onclick: run }, 'Re-run simulation')), out);
  run();
  return s;
}

function simTable(res) {
  const sorted = res.slice().sort((a, b) => b.champ - a.champ);
  const top = sorted[0].champ;
  const tb = el('tbody');
  for (const r of sorted) {
    const row = el('tr', {},
      el('td', {}, el('strong', {}, r.t.name)),
      el('td', { class: 'num' }, Math.round(r.t.rating)),
      el('td', { class: 'num mut' }, r.swissWins.toFixed(1)),
      el('td', { class: 'num' }, pct(r.swiss3)),
      el('td', { class: 'num' }, pct(r.main)),
      el('td', { class: 'num' }, pct(r.top4)),
      el('td', { class: 'num' }, el('strong', {}, pct(r.champ)),
        el('span', { class: 'mutt' }, ' ±' + (100 * 1.96 * r.mcErr).toFixed(1))),
      el('td', {}, barCell(r.champ / top, 'var(--blue)', 110)),
      el('td', {}, confBadge(confidence(r.t))),
    );
    hoverable(row, `<strong>${r.t.name}</strong><br>Champion ${pct(r.champ)} · Grand final ${pct(r.champ + r.final)}<br>
      Main Event ${pct(r.main)} · eliminated in Swiss ${pct(r.out)}<br>
      Mean Swiss record ${r.swissWins.toFixed(1)}–${(CFG.swissRounds - r.swissWins).toFixed(1)}<br>
      <em>± is Monte-Carlo noise (95%), not model error.</em>`);
    tb.append(row);
  }
  return el('div', { class: 'scroll' }, el('table', {}, el('thead', {}, el('tr', {},
    ...[['Team', 0], ['Rating', 1], ['Swiss W', 1], ['Swiss top 3', 1], ['Main Event', 1], ['Top 4', 1],
      ['Champion', 1], ['', 0], ['Data conf.', 0]].map(([h, n]) => el('th', { class: n ? 'num' : '' }, h)))), tb));
}

// ---- 5. interactive bracket builder ---------------------------------------
function bracketBuilder() {
  let seeds = T.slice(0, 8).map((_, k) => k);   // T-indices, top 8 by rating
  let picks = {};

  const resolve = ref => {
    if (ref.seed !== undefined) return seeds[ref.seed];
    const m = BY_ID[ref.win ?? ref.lose];
    const w = picks[m.id];
    if (w == null) return null;
    if (ref.win) return w;
    const a = resolve(m.a), b = resolve(m.b);
    return w === a ? b : a;                     // the loser is the other one
  };
  // Any pick that is no longer a participant of its own match is void. Repeat
  // until stable so a change at the top cascades all the way to the final.
  const prune = () => {
    for (let pass = 0; pass < BRACKET.length; pass++) {
      let dirty = false;
      for (const m of BRACKET) {
        if (picks[m.id] == null) continue;
        const a = resolve(m.a), b = resolve(m.b);
        // void unless both participants are known AND the pick is one of them,
        // so a ✓ never sits opposite a TBD
        if (a == null || b == null || (picks[m.id] !== a && picks[m.id] !== b)) {
          delete picks[m.id]; dirty = true;
        }
      }
      if (!dirty) break;
    }
  };

  const wrap = el('div');
  const draw = () => {
    const box = m => {
      const ai = resolve(m.a), bi = resolve(m.b);
      const A = ai != null ? T[ai] : null, B = bi != null ? T[bi] : null;
      const node = el('div', { class: 'bbox' },
        el('div', { class: 'mtitle' }, `${m.label} · Bo${m.bo}`,
          el('div', { style: 'font-weight:500;text-transform:none;letter-spacing:0;opacity:.8' }, m.sub)));
      const p = A && B ? predict(A, B).p : null;
      for (const [t, side, prob] of [[A, 'a', p], [B, 'b', p == null ? null : 1 - p]]) {
        const idx = side === 'a' ? ai : bi;
        const picked = t && picks[m.id] === idx;
        const beaten = t && picks[m.id] != null && !picked;
        const btn = el('button', {
          class: 'bteam' + (picked ? ' picked' : '') + (beaten ? ' beaten' : ''),
          onclick: () => { if (t) { picks[m.id] = idx; prune(); draw(); } },
        }, el('span', { class: 'nm' }, t ? t.name : (m[side].seed !== undefined ? `Seed ${m[side].seed + 1}` : 'TBD')),
          el('span', { class: 'wp' }, prob == null ? '' : pct(boWin(prob, m.bo))));
        if (!t) btn.disabled = true;   // setAttribute('disabled', null) would still disable it
        node.append(btn);
      }
      if (p != null) {
        const bar = el('div', { class: 'sc' });
        for (const s of seriesDist(p, m.bo)) {
          bar.append(hoverable(el('span', { class: s.c, style: `flex:${Math.max(s.p, 0.004)}` },
            s.p >= 0.11 ? s.l : ''), `<strong>${s.l}</strong> — ${A.name} ${s.c[0] === 'a' ? 'wins' : 'loses'}<br>${pct(s.p)} of series`));
        }
        node.append(bar);
      }
      return node;
    };
    const put = (m, area, conn) => {
      const n = box(m);
      n.setAttribute('style', 'grid-area:' + area);
      if (conn) n.setAttribute('data-conn', '1');
      return n;
    };
    const ub = el('div', { class: 'br br-ub' },
      put(BY_ID.ubsf1, '1/1'), put(BY_ID.ubsf2, '2/1'), put(BY_ID.ubf, '1/2/3/3', 1));
    const lb = el('div', { class: 'br br-lb' },
      put(BY_ID.lbr1a, '1/1'), put(BY_ID.lbr1b, '2/1'),
      put(BY_ID.lbr2a, '1/2', 1), put(BY_ID.lbr2b, '2/2', 1),
      put(BY_ID.lbsf, '1/3/3/4', 1), put(BY_ID.lbf, '1/4/3/5', 1));
    const gf = el('div', { class: 'br', style: 'grid-template-columns:216px' }, box(BY_ID.gf));

    const champ = picks.gf != null ? T[picks.gf] : null;
    wrap.replaceChildren(
      el('div', { class: 'stage' }, 'Upper bracket'), el('div', { class: 'scroll' }, ub),
      el('div', { class: 'stage' }, 'Lower bracket'), el('div', { class: 'scroll' }, lb),
      el('div', { class: 'stage' }, 'Grand final'), gf,
      champ ? el('div', { class: 'champbar', style: 'margin-top:14px' },
        el('span', { style: 'font-size:26px' }, '🏆'),
        el('div', {}, el('div', { class: 'mutt' }, 'Your predicted champion'),
          el('div', { style: 'font-size:20px;font-weight:700' }, champ.name)),
        el('div', { style: 'margin-left:auto' }, confBadge(confidence(champ))))
        : el('p', { class: 'sub', style: 'margin-top:14px' }, 'Click a team in any match to advance it — every downstream matchup updates.'));
  };

  // -- controls
  const seedRow = el('div', { class: 'seedgrid' });
  seeds.forEach((ti, k) => {
    const sel = el('select');
    T.forEach((t, i) => sel.append(el('option', { value: String(i) }, t.name)));
    sel.value = String(ti);
    sel.addEventListener('change', () => {
      const want = +sel.value, at = seeds.indexOf(want);
      if (at >= 0) {                             // keep all 8 distinct: swap
        seeds[at] = seeds[k];
        seedRow.querySelectorAll('select')[at].value = String(seeds[at]);
      }
      seeds[k] = want; prune(); draw();
    });
    seedRow.append(el('div', {}, el('label', {}, `Seed ${k + 1}`), sel));
  });

  const autofill = () => {
    for (const m of BRACKET) {          // BRACKET is topologically ordered
      const ai = resolve(m.a), bi = resolve(m.b);
      if (ai == null || bi == null) continue;
      picks[m.id] = predict(T[ai], T[bi]).p >= 0.5 ? ai : bi;
    }
    draw();
  };

  const s = el('section', {}, el('h2', {}, 'Bracket builder'),
    el('p', { class: 'sub' }, 'Set the eight main-event seeds, then click a team in any match to advance it. Each series shows its win probability and the full scoreline breakdown — how often it ends 2–0 versus going the distance.'),
    seedRow,
    el('div', { class: 'row' },
      el('button', { onclick: autofill }, 'Auto-pick favourites'),
      el('button', { onclick: () => { picks = {}; draw(); } }, 'Clear picks'),
      el('span', { class: 'mutt' }, 'Scoreline colours: blue = top team wins, red = bottom team wins; darker = more decisive.')),
    wrap);
  autofill();   // open on a complete bracket, not a wall of TBDs
  return s;
}

// ---- 6. methodology
function methodology() {
  return el('section', {}, el('h2', {}, 'How the numbers are made'),
    el('div', { class: 'grid2', style: 'margin-top:12px' },
      el('div', {},
        el('strong', {}, 'Rating'),
        el('ul', { class: 'tight' },
          el('li', {}, `Seeded from OpenDota's maintained pro Elo, then a time-decayed pass over every pro match in the last 18 months (K halves every ${CFG.formHalfLifeDays} days).`),
          el('li', {}, 'Rosters that moved orgs are merged onto their real history (Tundra→1w, HEROIC→LGD, PARIVISION→TEAM VISION).'),
          el('li', {}, 'Each team carries a σ, widened by a thin recent sample, a thin overall history, or an actual change of players. A Glicko g-factor then pulls that team\'s predictions toward 50/50.')),
        el('strong', { style: 'display:block;margin-top:14px' }, 'Match probability'),
        el('ul', { class: 'tight' },
          el('li', {}, 'Logistic on the rating gap, discounted by combined σ.'),
          el('li', {}, `Head-to-head residual: only the part of the H2H record the ratings don't already explain, shrunk by sample and capped at ±${(100 * CFG.h2hMaxSwing).toFixed(0)}pt.`),
          el('li', {}, 'Bo3 = p²(3−2p), Bo5 = p³(6p²−15p+10).'))),
      el('div', {},
        el('strong', {}, 'Draft'),
        el('ul', { class: 'tight' },
          el('li', {}, 'Per hero: 55% "how far above its own baseline does this team play it" + 45% "how strong is it in the pro meta".'),
          el('li', {}, `Newer patches weighted ${CFG.heroPatchWeights.join(':')}. Team winrates shrunk with ${CFG.heroShrink} pseudo-games, meta with ${CFG.metaShrink}.`),
          el('li', {}, `Total draft effect capped at ±${CFG.draftMaxElo} Elo — a draft tilts a game, it doesn't decide one.`)),
        el('strong', { style: 'display:block;margin-top:14px' }, 'Confidence score'),
        el('ul', { class: 'tight' },
          el('li', {}, 'Measures data quality, not how lopsided the call is: sample size, staleness, roster continuity, and hero-sample depth when a draft is entered.'),
          el('li', {}, 'A ≥78 · B ≥62 · C ≥44 · D below, ceilinged at 95. A confident 50/50 is a real answer, and a lopsided D is a guess.')),
        el('strong', { style: 'display:block;margin-top:14px' }, 'Known limits'),
        el('ul', { class: 'tight' },
          el('li', {}, 'No player-level modelling, no patch-specific team form, no LAN/online split, no stand-in detection.'),
          el('li', {}, 'Swiss pairing is modelled as score-group pairing with rematch avoidance; Valve\'s exact seeding rules may differ.'),
          el('li', {}, 'Hero edges are pick winrates, not draft-order or ban-phase modelling.')))));
}
</script>
